name: vinted-minipc-watcher
services:
  watcher:
    build:
      context: .
      dockerfile: Dockerfile.browser
    image: vinted-minipc-watcher-browser:local
    container_name: vinted-minipc-watcher
    user: "1000:1000"
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      STATE_DIR: /state
      BACKUP_DIR: /backups
    volumes:
      - ./data:/state
      - ./backups:/backups
      - ./config:/config:ro
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    memswap_limit: 3g
    cpus: 1.0
    pids_limit: 256
    shm_size: 256m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    healthcheck:
      test: [CMD, python, monitor.py, health]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
